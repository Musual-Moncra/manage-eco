[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manage-eco"
version = "0.1.0"
description = "Terminal app quản lý chi tiêu, dòng tiền và kế hoạch chi tiêu tương lai"
requires-python = ">=3.9"
dependencies = ["rich>=12"]

[project.scripts]
eco = "manage_eco.cli:main"

[tool.setuptools]
packages = ["manage_eco"]
